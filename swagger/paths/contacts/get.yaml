tags:
  - Contacts

summary: Get contacts
operationId: getContacts

description: Get all user contacts

security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    description: Current page number
    schema:
      type: integer
      example: 1

  - in: query
    name: perPage
    description: Number of contacts per page
    schema:
      type: integer
      example: 10

  - in: query
    name: sortBy
    description: Field used for sorting
    schema:
      type: string
      example: name

  - in: query
    name: sortOrder
    description: Sorting order
    schema:
      type: string
      example: asc

responses:
  "200":
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200

            message:
              type: string
              example: Successfully found contacts!

            data:
              type: array
              items:
                type: object

  "401":
    description: Unauthorized

  "500":
    description: Server error
