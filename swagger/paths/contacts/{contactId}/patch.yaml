tags:
  - Contacts

summary: Update contact
operationId: updateContact

description: Update existing contact

security:
  - bearerAuth: []

parameters:
  - in: path
    name: contactId
    required: true
    description: Contact id
    schema:
      type: string
      example: 685f8a123456789

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Doe

          phoneNumber:
            type: string
            example: "+123456789"

          email:
            type: string
            example: john@example.com

          isFavourite:
            type: boolean
            example: false

          contactType:
            type: string
            example: work

          photo:
            type: string
            format: binary

responses:
  "200":
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200

            message:
              type: string
              example: Successfully patched a contact!

            data:
              type: object

  "400":
    description: Validation error

  "401":
    description: Unauthorized

  "404":
    description: Contact not found

  "500":
    description: Server error
