tags:
  - Contacts

summary: Create contact
operationId: createContact

description: Create new contact

security:
  - bearerAuth: []

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: John Doe

          phoneNumber:
            type: string
            example: "+123456789"

          email:
            type: string
            example: john@example.com

          isFavourite:
            type: boolean
            example: false

          contactType:
            type: string
            example: work

          photo:
            type: string
            format: binary

responses:
  "201":
    description: Successfully created contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201

            message:
              type: string
              example: Successfully created a contact!

            data:
              type: object

  "400":
    description: Validation error

  "401":
    description: Unauthorized

  "500":
    description: Server error
