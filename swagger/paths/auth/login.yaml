tags:
  - Auth

summary: Login user
operationId: loginUser

description: Login existing user

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            example: test@gmail.com

          password:
            type: string
            example: password123

responses:
  "200":
    description: Login successful

  "401":
    description: Invalid credentials
