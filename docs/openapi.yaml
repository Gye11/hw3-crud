openapi: 3.1.0

info:
  title: Contacts API
  version: 1.0.0
  description: Contacts backend API documentation

servers:
  - url: http://localhost:3000
  - url: https://YOUR-RENDER-URL.onrender.com

tags:
  - name: Contacts
    description: Contacts endpoints

  - name: Auth
    description: Authentication endpoints

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml

    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml

    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml

    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml

  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register.yaml

  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login.yaml

  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Contact:
      type: object
      properties:
        _id:
          type: string
          example: 685f8a123456789

        name:
          type: string
          example: John Doe

        phoneNumber:
          type: string
          example: "+123456789"

        email:
          type: string
          example: john@example.com

        isFavourite:
          type: boolean
          example: false

        contactType:
          type: string
          example: work

        photo:
          type: string
          example: https://example.com/photo.jpg
